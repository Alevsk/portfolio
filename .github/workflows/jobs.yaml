name: Workflow

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ui-assets:
    name: "React Code Has No Vulnerabilities, Warnings & Prettified"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.NODE_VERSION }}
          cache: "yarn"

      - name: Install dependencies
        run: make install

      - name: Check code formatting
        run: make format-check

      - name: Run tests
        run: make test
        continue-on-error: true

      - name: Build for production
        run: make build

      - name: Check for known security issues
        run: yarn audit
        continue-on-error: true

  build-container:
    name: Build container image
    runs-on: ubuntu-latest
    needs: ui-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container (test)
        run: make docker-build

  build-and-push-container:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs:
      - ui-assets
      - build-container
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set build metadata
        id: meta
        run: |
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=$(git describe --exact-match --tags $(git log -n1 --pretty='%h') 2>/dev/null || git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            alevsk/portfolio:latest
            alevsk/portfolio:RELEASE.${{ steps.meta.outputs.BUILD_TIME }}
          build-args: |
            build_version=${{ steps.meta.outputs.BUILD_VERSION }}
            build_time=${{ steps.meta.outputs.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
